<style>
/* Layout: night-sky masthead with a single nova star, then a filterable shelf of picks, guides, and an honest disclosure. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#141A33; --muted:#59617D; --line:#DCE0EC;
  --night:#101634; --night-ink:#EEF0F8; --gold:#A8741C; --gold-soft:#F4E6C8; --chip:#E7EAF3;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-display-ar:"El Messiri","Readex Pro","Segoe UI",Tahoma,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E22; --surface:#121834; --ink:#E9ECF7; --muted:#9AA2C0; --line:#242C4D;
  --night:#060917; --night-ink:#EEF0F8; --gold:#E6B95B; --gold-soft:#2C2614; --chip:#1A2142; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E22; --surface:#121834; --ink:#E9ECF7; --muted:#9AA2C0; --line:#242C4D;
  --night:#060917; --night-ink:#EEF0F8; --gold:#E6B95B; --gold-soft:#2C2614; --chip:#1A2142; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .brand b{font-family:var(--f-display-ar)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* Masthead */
.mast{background:var(--night);color:var(--night-ink);position:relative;overflow:hidden}
.mast canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand b span{color:#E6B95B}
.lang{display:flex;border:1px solid rgba(238,240,248,.25);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:var(--night-ink);padding:6px 14px;border-radius:999px;font-size:14px}
.lang button[aria-pressed="true"]{background:#E6B95B;color:#101634;font-weight:600}
.hero{position:relative;padding-block:40px 64px;display:grid;gap:18px;max-width:720px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#E6B95B;font-weight:500}
[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14px}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.02em}
[dir="rtl"] .hero h1{letter-spacing:0;line-height:1.3}
.hero p{margin:0;font-size:18px;color:#C4C9DF;max-width:58ch}
.pillars{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pillars span{font-size:14px;border:1px solid rgba(238,240,248,.22);padding:6px 12px;border-radius:999px;color:#DDE1F0}

/* Shelf */
section{padding-block:48px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.head h2{font-size:clamp(24px,3.4vw,34px)}
.head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card > div:last-child{margin-top:auto}
.card .shot{width:100%;max-width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--chip);display:block}
.card .ic{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.card .ic svg{width:24px;height:24px}
.tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
[dir="rtl"] .tag{letter-spacing:0;font-size:13px}
.card h3{font-size:18px;font-weight:700}
[dir="rtl"] .card h3{font-size:19px}
.card p{margin:0;color:var(--muted);font-size:15px}
.best{font-size:13px;color:var(--ink);background:var(--chip);border-radius:8px;padding:6px 10px;align-self:start}
.go{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--gold);color:var(--surface);font-weight:600;padding:11px 14px;border-radius:10px;font-size:15px}
:root[data-theme="dark"] .go{color:#101634}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{color:#101634}}
.go:hover{filter:brightness(1.07)}

/* Guides */
.guides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.guide{border-top:3px solid var(--gold);padding-top:14px;display:grid;gap:6px}
.guide h3{font-size:19px}
.guide p{margin:0;color:var(--muted);font-size:15px}
.soon{font-size:12px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
[dir="rtl"] .soon{letter-spacing:0;font-size:13px}

/* Disclosure + footer */
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:6px}
.note h3{font-size:17px}
.note p{margin:0;color:var(--muted);font-size:15px;max-width:75ch}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let lang = "ar", cat = "all";

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t[el.dataset.i]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  const f = document.getElementById("filters");
  f.setAttribute("aria-label", lang === "ar" ? "تصفية حسب الفئة" : "Filter by category");
  f.innerHTML = Object.keys(CATS).map(k =>
    `<button type="button" id="f-${k}" data-cat="${k}" aria-pressed="${k===cat}">${esc(CATS[k][lang])}</button>`).join("");

  const list = PRODUCTS.filter(p => cat === "all" || p.cat === cat);
  document.getElementById("grid").innerHTML = list.map(p => {
    const [name, why, best] = p[lang];
    return `<article class="card">
      ${p.img ? `<img class="shot" src="${p.img}" alt="${esc(name)}" loading="lazy">` : ""}
      <div style="display:flex;align-items:center;gap:12px">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[p.ic]}</svg></div>
        <span class="tag">${esc(CATS[p.cat][lang])}</span>
      </div>
      <h3>${esc(name)}</h3>
      <p>${esc(why)}</p>
      <div style="display:grid;gap:12px">
        <span class="best">${esc(t.bestFor)}: ${esc(best)}</span>
        <a class="go" href="${p.link}" target="_blank" rel="sponsored noopener">${esc(t.go)}</a>
      </div>
    </article>`;
  }).join("");

  document.getElementById("guideList").innerHTML = GUIDES.map(g =>
    `<article class="guide"><span class="soon">${esc(t.soon)}</span><h3>${esc(g[lang][0])}</h3><p>${esc(g[lang][1])}</p></article>`).join("");
}

document.querySelector(".lang").addEventListener("click", e => {

  render();
});

// Quiet starfield behind the masthead
(function(){
  const c = document.getElementById("sky"), x = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [], w, h;
  function size(){
    const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
    w = r.width; h = r.height; c.width = w*d; c.height = h*d; x.setTransform(d,0,0,d,0,0);
    stars = Array.from({length: Math.round(w*h/5000)}, () => ({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.2+.2, p:Math.random()*6.28}));
  }
  function draw(t){
    x.clearRect(0,0,w,h);
    const nx = document.documentElement.dir === "rtl" ? w*0.16 : w*0.84, ny = h*0.42;
    const g = x.createRadialGradient(nx,ny,0,nx,ny,Math.min(w,h)*0.55);
    g.addColorStop(0,"rgba(230,185,91,.35)"); g.addColorStop(.35,"rgba(230,185,91,.08)"); g.addColorStop(1,"rgba(230,185,91,0)");
    x.fillStyle = g; x.fillRect(0,0,w,h);
    for(const s of stars){
      const a = .35 + .45*Math.sin(s.p + (t||0)/1400);
      x.fillStyle = `rgba(238,240,248,${a})`; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill();
    }
    if(!still) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", size); draw(0);
})();
